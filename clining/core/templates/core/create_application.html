<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая заявка</title>
</head>
<body>
    <h1>Новая заявка</h1>

    <a href="{% url 'home' %}">На главную</a>

    <form method="post">
        {% csrf_token %}
        
        <label>Адрес:</label>
        <input type="text" name="address" required>
        <br>
        
        <label>Контактный телефон:</label>
        <input type="tel" name="contact_phone" required>
        <br>
        
        <label>Желаемая дата:</label>
        <input type="date" name="application_date" min="{% now 'Y-m-d' %}" required>
        <br>
        
        <label>Желаемое время:</label>
        <input type="time" name="application_time" required>
        <br>
        
        <label>Вид услуги:</label>
        <select name="service" required>
            <option value="cleaning">Общая уборка</option>
            <option value="general_cleaning">Генеральная уборка</option>
            <option value="post_build">Послестроительная уборка</option>
            <option value="dry_cleaning">Химчистка ковров и мебели</option>
        </select>
        <br>
        
        <label>Способ оплаты:</label>
        <select name="payment" required>
            <option value="cash">Наличными</option>
            <option value="card">Банковской картой</option>
        </select>
        <br>
        
        <button type="submit">Отправить заявку</button>
    </form>

    {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
    {% endif %}
</body>
</html>

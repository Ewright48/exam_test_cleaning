{% extends 'core/base.html' %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="bg-white rounded-md border p-6 max-w-md mx-auto border-color">
    <h2 class="text-2xl font-bold text-center mb-6 text-color">Вход в систему</h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block mb-1 text-color">Логин:</label>
            <input type="text" name="username" required class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#8baff4] border-color">
        </div>
        
        <div>
            <label class="block mb-1 text-color">Пароль:</label>
            <input type="password" name="password" required class="w-full border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#8baff4] border-color">
        </div>
        
        <button type="submit" class="w-full text-white py-2 rounded-md hover:opacity-90 transition bg-color">Войти</button>
    </form>

    <p class="text-center mt-4 text-color">
        Нет аккаунта? <a href="{% url 'register' %}" class="hover:underline" style="color: #8baff4;">Зарегистрироваться</a>
    </p>
</div>
{% endblock %}
